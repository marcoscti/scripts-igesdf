<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

</head>

<body>
    <style>
        nav.cards-ouvidoria {
            display: flex;
        }

        .card-ouvidoria .img-ouvidoria {
            background: #fff;
            border-radius: 50%;
            width: 80px;
            height: 80px;
        }


        @media (max-width: 1024px) {
            nav.cards-ouvidoria {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr 1fr;
                gap: 2px;
                justify-items: center;
                align-items: center;
            }

            .card-ouvidoria {
                max-width: 120px;
            }

        }

        @media (max-width: 600px) {
            nav.cards-ouvidoria {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 2px;
                justify-items: center;
                align-items: center;
            }
        }

        .card-ouvidoria {
            max-width: 190px;
            min-width: 90px;
            width: 100%;
            height: 190px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            cursor: pointer;
        }

        .card-ouvidoria h1 {
            font-size: 18px;
            text-align: center;
            z-index: 1;
            font-family: sans-serif;
            font-weight: bold;
            margin: 0;
            margin-top: 10px;
            padding: 0 15px;
            text-shadow: 1px 1px 2px #555454;
        }

        .cards-ouvidoria a {
            text-decoration: none;
            transition: opacity 0.3s ease-in-out;
        }

        .cards-ouvidoria.has-active-card a:not(.active) .img-ouvidoria,
        .cards-ouvidoria.has-active-card a:not(.active) canvas {
            opacity: 0.50;
        }

        .cards-ouvidoria.has-active-card a:not(.active):hover canvas,
        .cards-ouvidoria.has-active-card a:not(.active):focus-visible canvas,
        .cards-ouvidoria.has-active-card a:not(.active) .img-ouvidoria {
            opacity: 1;
        }

        .card-ouvidoria:hover {
            transform: scale(1.05);
            transition: transform 0.3s ease-in-out;
        }

        .card-ouvidoria:hover canvas {
            filter: brightness(1.1);
            transition: filter 0.3s ease-in-out;
        }

        .card-ouvidoria:hover .img-ouvidoria {
            transform: scale(1.1);
            transition: transform 0.3s ease-in-out;
            filter: brightness(1.1);
        }

        .card-ouvidoria canvas {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            z-index: -1;
        }

        .card-ouvidoria .img-ouvidoria img {
            box-sizing: border-box;
            object-fit: scale-down;
        }

        #ouvidoria {
            fill: #0094C6;
        }

        #registro {
            fill: #00B3C4
        }

        #formas-registro {
            fill: #F2D64B;
        }

        #legislacoes-manuais {
            fill: #0094c6;
        }

        #relatorios {
            fill: #c8d400;
        }

        #painel-analitico {
            fill: #F2D64B;
        }

        #perguntas-frequentes {
            fill: #00B3C4;
        }
        #tipologia{
            fill: #EC6608;
        }
    </style>

    <script>
        const cardsNavigation = document.querySelector('.cards-ouvidoria');
        const currentPath = window.location.pathname.replace(/\/+$/, '') || '/';

        cardsNavigation.querySelectorAll('a').forEach(link => {
            const linkPath = new URL(link.href, window.location.href).pathname.replace(/\/+$/, '') || '/';

            if (linkPath === currentPath) {
                link.classList.add('active');
                link.setAttribute('aria-current', 'page');
                cardsNavigation.classList.add('has-active-card');
            }
        });

        const size = 215;
        const defaultColor = '#0094C6';

        function drawShape(ctx) {
            ctx.beginPath();
            ctx.moveTo(40, 15);
            ctx.bezierCurveTo(69, 8, 112, 6, 139, 9);
            ctx.bezierCurveTo(179, 12, 197, 25, 200, 57);
            ctx.bezierCurveTo(205, 91, 204, 139, 205, 168);
            ctx.bezierCurveTo(205, 192, 185, 202, 157, 205);
            ctx.bezierCurveTo(119, 209, 69, 208, 39, 202);
            ctx.bezierCurveTo(15, 197, 9, 183, 9, 157);
            ctx.bezierCurveTo(7, 119, 6, 78, 8, 56);
            ctx.bezierCurveTo(10, 33, 20, 21, 40, 15);
            ctx.closePath();
        }

        function drawCard(canvas, color = defaultColor) {
            const ctx = canvas.getContext('2d');
            const scale = window.devicePixelRatio || 1;

            canvas.width = size * scale;
            canvas.height = size * scale;
            ctx.scale(scale, scale);

            drawShape(ctx);
            const background = ctx.createLinearGradient(0, 0, 190, 210);
            background.addColorStop(0, color);
            background.addColorStop(1, color);
            ctx.fillStyle = background;
            ctx.fill();

            ctx.save();
            drawShape(ctx);
            ctx.clip();

            ctx.beginPath();
            ctx.moveTo(8, 116);
            ctx.bezierCurveTo(9, 74, 32, 42, 72, 26);
            ctx.bezierCurveTo(93, 17, 113, 15, 131, 17);
            ctx.bezierCurveTo(91, 29, 73, 48, 53, 71);
            ctx.bezierCurveTo(33, 91, 20, 112, 8, 147);
            ctx.closePath();
            const left = ctx.createLinearGradient(5, 15, 105, 130);
            ctx.fillStyle = left;
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(64, 82);
            ctx.bezierCurveTo(104, 64, 159, 69, 186, 91);
            ctx.bezierCurveTo(201, 103, 205, 121, 207, 145);
            ctx.lineTo(207, 180);
            ctx.bezierCurveTo(173, 157, 143, 135, 106, 128);
            ctx.bezierCurveTo(68, 120, 35, 139, 9, 174);
            ctx.lineTo(9, 130);
            ctx.bezierCurveTo(24, 107, 42, 92, 64, 82);
            ctx.closePath();
            const middle = ctx.createLinearGradient(30, 75, 180, 180);
            middle.addColorStop(0, 'rgba(0, 0, 0, 0.03)');
            ctx.fillStyle = middle;
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(8, 181);
            ctx.bezierCurveTo(30, 145, 61, 125, 95, 122);
            ctx.bezierCurveTo(130, 119, 169, 143, 205, 171);
            ctx.lineTo(205, 215);
            ctx.lineTo(8, 215);
            ctx.closePath();
            const bottom = ctx.createLinearGradient(30, 120, 120, 210);
            bottom.addColorStop(0, 'rgba(255, 255, 255, 0.04)');
            bottom.addColorStop(1, 'rgba(0, 0, 0, 0.05)');
            ctx.fillStyle = bottom;
            ctx.fill();

            const shadow = ctx.createLinearGradient(0, 175, 0, 210);
            shadow.addColorStop(0, 'rgba(0, 0, 0, 0)');
            shadow.addColorStop(1, 'rgba(0, 0, 0, 0.03)');
            ctx.fillStyle = shadow;
            ctx.fillRect(0, 175, size, 40);

            ctx.restore();
        }

        function renderCards(root) {
            if (root.matches?.('.card-ouvidoria canvas')) {
                drawCard(root, root.dataset.color || defaultColor);
            }

            root.querySelectorAll?.('.card-ouvidoria canvas').forEach(canvas => {
                drawCard(canvas, canvas.dataset.color || defaultColor);
            });
        }

        renderCards(document);

        new MutationObserver(records => {
            records.forEach(record => {
                record.addedNodes.forEach(node => {
                    if (node.nodeType === Node.ELEMENT_NODE) {
                        renderCards(node);
                    }
                });
            });
        }).observe(document.body, { childList: true, subtree: true });
    </script>
