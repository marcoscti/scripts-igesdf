<style>
  body {
    min-height: 300vh;
  }

  .floatingButtonWrap {
    position: fixed;
    bottom: 45px;
    left: 10px;
    z-index: 999999;
  }

  .floatingButtonInner {
    position: relative;
  }

  .floatingButton {
    width: 60px;
    height: 60px;
    padding: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: 2px solid #d4d4d3;
    background: #fff;
    text-decoration: none;
    box-sizing: border-box;
  }
  .floatingButton:hover{
    border: 2px solid #c8d400;
  }
  .floatingButton svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* MENU */

  .floatingMenu {
    position: absolute;

    bottom: 70px;

    display: flex;
    flex-direction: column;
    gap: 8px;

    margin: 0;
    padding: 0;
    list-style: none;

    opacity: 0;
    visibility: hidden;

    transform: translateX(20px);

    transition:
      opacity 0.25s ease,
      transform 0.25s ease,
      visibility 0.25s ease;
  }

  .floatingMenu.open {
    opacity: 1;
    visibility: visible;
    transform: translateX(0);
  }

  .floatingMenu li {
    margin: 0;
    padding: 0;
  }

  .floatingMenu li a {
    display: inline-block;
    padding: 8px 15px;
    font-family: 'Open sans', 'sans-serif';
    background: #c8d400;
    color: #575756;

    border-radius: 5px;
    text-decoration: none;
    white-space: nowrap;

    box-shadow: 1px 3px 5px rgba(211, 224, 255, 0.5);

    transition:
      transform 0.3s ease,
      background 0.3s ease;
  }

  .floatingMenu li a:hover {
    transform: translateX(-10px);
    font-weight: 600;
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const floatingButton = document.querySelector(".floatingButton");
    const floatingMenu = document.querySelector(".floatingMenu");
    const floatingButtonWrap = document.querySelector(".floatingButtonWrap");

    if (!floatingButton || !floatingMenu) return;

    // Abre / Fecha menu
    floatingButton.addEventListener("mouseenter", (e) => {
      e.preventDefault();

      floatingButton.classList.toggle("open");
      floatingMenu.classList.toggle("open");
    });
    floatingButton.addEventListener("click", (e) => {
      e.preventDefault();

      floatingButton.classList.toggle("open");
      floatingMenu.classList.toggle("open");
    });
    // Clique nos itens
    floatingMenu.addEventListener("click", (e) => {
      const link = e.target.closest("a");

      if (!link) return;

      e.preventDefault();

      const destino = document.querySelector(link.getAttribute("href"));

      if (destino) {
        destino.scrollIntoView({
          behavior: "smooth",
          block: "start",
        });
      }

      floatingButton.classList.remove("open");
      floatingMenu.classList.remove("open");
    });

    // Fecha clicando fora
    document.addEventListener("click", (e) => {
      if (!floatingButtonWrap.contains(e.target)) {
        floatingButton.classList.remove("open");
        floatingMenu.classList.remove("open");
      }
    });
  });
</script>
